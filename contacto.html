<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Formulario de Contacto</h2>

    <form action="/submit" method="POST">
        <!-- Campo con etiqueta adecuada -->
        <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <!-- Fallo a propósito 1: Campo sin etiqueta <label> asociativa para accesibilidad -->
        <div class="form-group">
            <input type="email" id="txt1" name="txt1" placeholder="Introduce tu correo electrónico" required>
        </div>

        <!-- Fallo a propósito 2: Atributo name/id confuso o con errata para el mensaje -->
        <div class="form-group">
            <label for="msg_user">Mensaje:</label>
            <textarea id="msg_user" name="data_x" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>

        <button type="submit">Enviar</button>
    </form>

</body>
</html>
